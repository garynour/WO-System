  $("#app").innerHTML=`<div class="card" style="max-width:400px;margin:24px auto;text-align:center"><img src="icons/icon-192.png" width="84" height="84" alt="" style="border-radius:20px"><h3 style="margin-top:10px">${L("Install Work Orders","ثبّت تطبيق أوامر التشغيل")}</h3><div class="mut" style="margin-bottom:12px">${L("To use the system, install it on your phone. It gets its own icon on your home screen and opens full screen like any other app.","لاستخدام النظام، ثبّته على هاتفك. ستجد له أيقونة على الشاشة الرئيسية، ويفتح بملء الشاشة مثل أي تطبيق.")}</div>`
   +(done?`<div class="tag dn" style="margin-bottom:10px">${L("Installed","تم التثبيت")} \u2713</div><div class="mut">${L("Now open <b>Work Orders</b> from your home screen.","الآن افتح التطبيق من أيقونته على الشاشة الرئيسية.")}</div>`
    :IOSD?ol(L(['Tap the <b>Share</b> button <span style="font-size:18px">\u2b06\ufe0f</span> at the bottom of Safari','Scroll down and tap <b>Add to Home Screen</b>','Tap <b>Add</b>','Open <b>Work Orders</b> from your home screen'],['اضغط زر <b>المشاركة</b> <span style="font-size:18px">\u2b06\ufe0f</span> أسفل متصفح Safari','مرّر للأسفل واضغط <b>إضافة إلى الشاشة الرئيسية</b> (Add to Home Screen)','اضغط <b>إضافة</b>','افتح <b>Work Orders</b> من الشاشة الرئيسية']))
    :(ip?`<button class="b1 w" onclick="ip.prompt()">${L("Install app","تثبيت التطبيق")}</button>`:ol(L(['Tap the <b>\u22ee</b> menu in Chrome (top right)','Tap <b>Install app</b> or <b>Add to Home screen</b>','Tap <b>Install</b>','Open <b>Work Orders</b> from your home screen'],['اضغط قائمة <b>\u22ee</b> في Chrome (أعلى الشاشة)','اضغط <b>تثبيت التطبيق</b> أو <b>إضافة إلى الشاشة الرئيسية</b>','اضغط <b>تثبيت</b>','افتح <b>Work Orders</b> من الشاشة الرئيسية']))))
   +(INAPP?`<div class="mut" style="color:var(--bad);margin-top:10px">${L("You opened this link inside another app (such as WhatsApp). Open it in Chrome or Safari first.","فتحتَ الرابط من داخل تطبيق آخر (مثل واتساب). افتحه أولًا في Chrome أو Safari.")}</div>`:"")+`</div>`}
if(!window.FB_CONFIG||/^PASTE/.test(window.FB_CONFIG.apiKey||"")){$("#app").innerHTML='<div class="card"><h3>Setup needed</h3><div class="mut">Open <b>config.js</b> and paste your Firebase settings (see START-HERE.html, step 5), then upload it again.</div></div>';throw new Error("config.js is not set")}
firebase.initializeApp(window.FB_CONFIG);const auth=firebase.auth();db=firebase.firestore();
let authMode="in",unsubO=null,unsubR=null,started=false,invs={},actv={},activating=false,loginMsg="";
const fbOut=()=>auth.signOut();
const normPhone=s=>{let d=String(s||"").replace(/\D/g,"");if(d.startsWith("0020"))d="0"+d.slice(4);else if(d.startsWith("20")&&d.length===12)d="0"+d.slice(2);else if(d.startsWith("00"))d=d.slice(2);return d.length>=10&&d.length<=15?d:""};
const toEmail=p=>p+"@wo.app",intl=p=>p.startsWith("0")?"2"+p:p;
const friendly=x=>({"auth/wrong-password":"Wrong mobile number or password","auth/invalid-credential":"Wrong mobile number or password","auth/user-not-found":"Wrong mobile number or password","auth/invalid-login-credentials":"Wrong mobile number or password","auth/email-already-in-use":"This number is already activated with a different password. Ask your manager for a new activation code.","auth/weak-password":"Password must be at least 6 characters","auth/too-many-requests":"Too many attempts. Try again later."}[x.code]||x.message);
function showLogin(m){const msg=m||loginMsg;loginMsg="";$("#act").innerHTML="";const up=authMode==="up";
  $("#app").innerHTML=`<div class="card" style="max-width:380px;margin:30px auto"><h3>${up?"Activate your account":"Sign in"}</h3>${up?'<div class="mut" style="margin-bottom:8px">Use the mobile number and activation code your manager gave you, then choose your own password.</div><label>Full name<input id="lg_n" autocomplete="name"></label>':""}<label style="margin-top:6px">Mobile number<input id="lg_e" type="tel" inputmode="tel" autocomplete="username" placeholder="01xxxxxxxxx"></label>${up?'<label style="margin-top:6px">Activation code<input id="lg_c" inputmode="numeric" autocomplete="one-time-code"></label>':""}<label style="margin-top:6px">Password<input id="lg_p" type="password" autocomplete="${up?"new-password":"current-password"}"></label>${up?'<label style="margin-top:6px">Confirm password<input id="lg_p2" type="password" autocomplete="new-password"></label>':""}<div class="mut" style="color:var(--bad);margin:6px 0">${esc(msg)}</div><button class="b1 w" onclick="doAuth()">${up?"Activate &amp; sign in":"Sign in"}</button><div class="mut click" style="margin-top:10px;text-align:center" onclick="authMode=authMode==='in'?'up':'in';showLogin()">${up?"Already activated? Sign in":"First time? Activate your account"}</div></div>`}
async function doAuth(){
  const ph=normPhone(E("lg_e").value),pw=E("lg_p").value;
  if(!ph)return showLogin("Enter a valid mobile number");if(pw.length<6)return showLogin("Password must be at least 6 characters");
  if(authMode==="in"){try{await auth.signInWithEmailAndPassword(toEmail(ph),pw)}catch(x){showLogin(friendly(x))}return}
  const n=E("lg_n").value.trim(),c=E("lg_c").value.trim(),p2=E("lg_p2").value;
  if(!n)return showLogin("Enter your full name");if(!c)return showLogin("Enter the activation code");if(pw!==p2)return showLogin("Passwords do not match");
  activating=true;let cred;
  try{try{cred=await auth.createUserWithEmailAndPassword(toEmail(ph),pw)}catch(e){if(e.code==="auth/email-already-in-use")cred=await auth.signInWithEmailAndPassword(toEmail(ph),pw);else throw e}
    try{await db.doc("users/"+ph).set({name:n,phone:ph,code:c})}catch(e){try{await cred.user.delete()}catch(x){await auth.signOut()}activating=false;return showLogin("Invalid activation code for this number. Ask your manager.")}
    activating=false;boot(auth.currentUser)}
  catch(x){activating=false;showLogin(friendly(x))}
}
function pendingV(){$("#act").innerHTML='<div class="mut">'+esc(me.name)+' \u2022 <a href="#" onclick="fbOut();return false">Sign out</a></div>';$("#app").innerHTML='<div class="card"><h3>No permissions yet</h3><div class="mut">Your account is active but the manager has not given you access. Ask the manager to add your number from the Users screen, then reload this page.</div></div>'}
async function boot(u){
  if(unsubO){unsubO();unsubO=null}if(unsubR){unsubR();unsubR=null}unsubs.forEach(f=>f());unsubs=[];lastKey="";started=false;
  if(!u){me={name:""};meId=null;canEdit=false;return showLogin()}
  const ph=(u.email||"").split("@")[0];let ud=null;try{ud=await db.doc("users/"+ph).get()}catch(e){}
  if(!ud||!ud.exists){loginMsg="This number is not activated yet. Tap \"First time? Activate your account\" and enter the activation code you received.";await auth.signOut();return}
  meId=ph;me={id:ph,name:ud.data().name||ph};
  try{canEdit=(await db.doc("admins/"+ph).get()).exists}catch(e){canEdit=false}
  U={profiles:async ids=>{const r={};await Promise.all(ids.map(async i=>{const d=await db.doc("users/"+i).get();actv[i]=d.exists;let nm=d.exists?d.data().name:"";try{const v=await db.doc("invites/"+i).get();if(v.exists){invs[i]=v.data();nm=nm||v.data().name}}catch(e){}r[i]={name:nm}}));return r}};
  unsubR=db.doc("roles/map").onSnapshot(d=>{
    if(view==="users")return;
    const dd=d.exists?d.data()||{}:{};roles=dd.assign||{};sigs=dd.sigs||{};
    if(!(canEdit||roles[meId]!==undefined||sigs[meId]!==undefined))return pendingV();
    if(!landed&&!canEdit&&myD().length){landed=true;flt="mine";view=myD().length===1?"dept":"depts";dk=myD()[0];dtab="act"}else if(!landed&&!canEdit&&mySig().length){landed=true;flt="sign"}
    startData();render();
  },e=>toast("Connection error: "+e.code));
}
if(gate)showInstall();else auth.onAuthStateChanged(u=>{if(!activating)boot(u)});
</script></body></html>
